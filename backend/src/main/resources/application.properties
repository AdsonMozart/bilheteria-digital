spring.application.name=bilheteria-digital

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bilheteria_digital?createDatabaseIfNotExist=true&serverTimezone=America/Bahia}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:24}

app.tmdb.base-url=${TMDB_BASE_URL:https://api.themoviedb.org/3}
app.tmdb.image-base-url=${TMDB_IMAGE_BASE_URL:https://image.tmdb.org/t/p}
app.tmdb.access-token=${TMDB_ACCESS_TOKEN}
app.tmdb.language=${TMDB_LANGUAGE:pt-BR}

app.ticketmaster.base-url=${TICKETMASTER_BASE_URL:https://app.ticketmaster.com/discovery/v2}
app.ticketmaster.api-key=${TICKETMASTER_API_KEY}
app.ticketmaster.locale=${TICKETMASTER_LOCALE:pt-br}
app.ticketmaster.country-code=${TICKETMASTER_COUNTRY_CODE:BR}

app.stripe.secret-key=${STRIPE_SECRET_KEY}
app.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}